version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: packvision-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=sqlite:///./storage/packvision.db
      - STORAGE_PATH=./storage
      - USE_MOCK_INFERENCE=true
      - MAX_UPLOAD_MB=25
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  gradio:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: packvision-gradio-workbench
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - USE_MOCK_INFERENCE=true
      - STORAGE_PATH=./storage
    volumes:
      - ./storage:/app/storage
      - ./models:/app/models
    command: ["python", "ui/app_gradio.py"]
    depends_on:
      - backend
