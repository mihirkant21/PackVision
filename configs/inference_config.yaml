# =============================================================================
# PackVision AI - Inference Engine Configuration
# =============================================================================

model:
  base_model_id: "stabilityai/stable-diffusion-xl-base-1.0"
  controlnet_model_id: "diffusers/controlnet-canny-sdxl-1.0"
  vae_model_id: "madebyollin/sdxl-vae-fp16-fix"
  lora_weights_path: "models/checkpoints/packvision_sdxl_lora.safetensors"
  lora_scale: 0.85
  mixed_precision: "fp16"
  enable_model_cpu_offload: true

execution:
  # When set to true or when CUDA is unavailable, falls back to ProceduralPackagingRenderer
  use_mock_inference: true
  device: "auto" # 'cuda', 'cpu', or 'auto'
  seed: 42
  num_workers: 4

preprocessing:
  target_size: [1024, 1024]
  auto_invert: true
  enhance_faint_strokes: true
  clahe_clip_limit: 2.5
  dilation_kernel_size: 2
  canny_sigma: 0.33
  low_threshold: null # computed adaptively if null
  high_threshold: null # computed adaptively if null

generation:
  num_inference_steps: 30
  guidance_scale: 7.5
  controlnet_conditioning_scale: 0.80
  scheduler: "UniPCMultistepScheduler" # 'UniPCMultistepScheduler' or 'DPMSolverMultistepScheduler'

defaults:
  category: "carton"
  substrate: "coated SBS"
  finish: "matte"
  lighting: "studio softbox"
  camera_angle: "three-quarter"
  background: "seamless studio"

postprocessing:
  enable_logo_compositing: true
  default_blend_mode: "normal" # 'normal', 'multiply', 'overlay', 'hard_light'
  default_opacity: 0.95
  preserve_texture_strength: 0.65
  unsharp_strength: 0.35

storage:
  inputs_dir: "./storage/inputs"
  outputs_dir: "./storage/outputs"
  thumbnails_dir: "./storage/thumbnails"
  max_upload_mb: 25
