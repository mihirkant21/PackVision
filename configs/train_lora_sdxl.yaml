# =============================================================================
# PackVision AI - Stable Diffusion XL LoRA Fine-Tuning Configuration
# =============================================================================
# Hyperparameters for training domain-specific packaging LoRA adapters on SDXL.

pretrained_model_name_or_path: "stabilityai/stable-diffusion-xl-base-1.0"
pretrained_vae_model_name_or_path: "madebyollin/sdxl-vae-fp16-fix"
revision: null
variant: "fp16"

# Dataset and Output paths
dataset_path: "data"
metadata_file: "data/metadata.jsonl"
output_dir: "models/checkpoints/lora_packaging_sdxl"
logging_dir: "storage/logs"

# LoRA Architecture Configuration
lora_config:
  r: 64
  lora_alpha: 32
  target_modules:
    - "to_k"
    - "to_q"
    - "to_v"
    - "to_out.0"
  lora_dropout: 0.05
  bias: "none"

# Training Hyperparameters
training:
  seed: 42
  resolution: 1024
  train_batch_size: 1
  gradient_accumulation_steps: 4
  max_train_steps: 2500
  learning_rate: 1.0e-4
  scale_lr: false
  lr_scheduler: "cosine_with_restarts"
  lr_warmup_steps: 150
  lr_num_cycles: 2
  snr_gamma: 5.0 # Min-SNR weighting for diffusion stability

# Optimization & Efficiency
optimization:
  mixed_precision: "fp16"
  gradient_checkpointing: true
  enable_xformers_memory_efficient_attention: true
  use_8bit_adam: true
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1.0e-2
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

# Checkpointing & Validation
validation:
  validation_prompt: "award-winning commercial packshot of a folding boxboard carton, natural brown kraft paperboard, gold foil logo, studio softbox lighting"
  validation_steps: 250
  num_validation_images: 4
  checkpointing_steps: 500
  checkpoints_total_limit: 3
  resume_from_checkpoint: null
